aid: aqtual
name: Aqtual
description: 'Aqtual, Inc. is a Hayward, California precision-medicine company founded
  in 2019 by Diana Abdueva (Founder and CEO) and co-founder Rich Rava, developing blood-based
  diagnostics on a proprietary "active chromatin" cell-free DNA (cfDNA) platform. Rather
  than reading cfDNA for mutations alone, Aqtual captures the previously unexplored
  cfDNA fragments bound to active chromatin, so a single routine blood draw reports
  on DNA, epigenetic regulation and protein-DNA binding together — surveying on the
  order of 200,000 gene promoters, 400,000 enhancers, 50,000 insulators, 20,000 silencers
  and a million transcription-factor binding sites. Its lead product is a therapy-response
  prediction test for rheumatoid arthritis, evaluated in the prospective PRIMA-102
  observational trial (NCT05936970), with oncology programs in leiomyosarcoma immunotherapy
  response and early colorectal cancer detection, and stated expansion into immunology,
  cardiovascular, metabolic and neurological disease. The company raised a USD 16 million
  Series A in October 2023 and over USD 31 million in Series B funding announced July
  2025 from Bold Capital, the Bold Longevity Growth Fund, Genoa Ventures, Manta Ray
  Ventures and Yu Galaxy. Aqtual is a clinical-diagnostics and life-sciences business,
  not a software vendor: as of August 2026 it publishes no developer portal, no API
  documentation and no machine-readable API contract of any kind, and every /.well-known/
  and contract-discovery path on aqtual.com returns 404.'
